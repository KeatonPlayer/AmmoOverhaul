; Build 1: .308 brass/polymer native ejection test.
; Install the DLL and this INI in Data\NVSE\Plugins.
; Restart the game after INI edits. No hot reload.
[General]
Enabled=1
DebugLog=1
; For this test both NIFs must exist as loose files in Data\Meshes.
; Set 0 only when intentionally supplying those meshes through a BSA.
RequireLooseMeshes=1
PendingTimeoutMs=30000

; All Type=Ammo rules take priority over all Type=List rules.
; Form IDs are local IDs WITHOUT a load-order prefix.
[Rule1]
Type=Ammo
Plugin=GrandAmmoOverhaul.esp
Form=001673
Model=GrandAmmoOverhaul\.308\Polymer 308.nif

; This list originates in FalloutNV.esm. The live winning override is used,
; including GrandAmmoOverhaul additions. Do not change its owner to the ESP.
[Rule2]
Type=List
Plugin=FalloutNV.esm
Form=1537E9
Model=GrandAmmoOverhaul\.308\Brass 308.nif
